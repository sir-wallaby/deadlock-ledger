<template>
    <template if:true={empty}>
        <section class="empty slds-m-around_large">
            <svg
                class="empty__teapot"
                viewBox="0 0 128 128"
                xmlns="http://www.w3.org/2000/svg"
                role="img"
                aria-label="teapot"
            >
                <g fill="none" stroke="#74685e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M38 52 h44 a10 10 0 0 1 10 10 v20 a22 22 0 0 1 -22 22 h-20 a22 22 0 0 1 -22 -22 v-20 a10 10 0 0 1 10 -10 z" fill="#f3f2f1" />
                    <path d="M92 60 l16 -8 v26 l-16 -6" fill="#f3f2f1" />
                    <path d="M46 52 c0 -14 26 -14 26 0" />
                    <circle cx="59" cy="34" r="5" />
                    <path d="M40 96 c-8 8 -18 8 -24 2" />
                </g>
            </svg>
            <h2 class="slds-text-heading_medium slds-m-top_small">418 — I'm a teapot</h2>
            <p class="empty__msg">No Standard matches found for this player.</p>
        </section>
    </template>

    <template if:false={empty}>
        <section class="summary slds-m-bottom_medium">
            <div class="summary__grid">
                <div class="slds-box slds-theme_shade summary__card">
                    <div class="summary__label">Total Standard Wins</div>
                    <div class="summary__value">
                        {totalWins} <span class="summary__goal">/ 60</span>
                    </div>
                    <lightning-progress-bar
                        value={totalWinsPct}
                        size="large"
                        aria-label="Progress toward 60 Standard wins"
                    ></lightning-progress-bar>
                </div>
                <div class="slds-box slds-theme_shade summary__card">
                    <div class="summary__label">Heroes at 15+ Wins</div>
                    <div class="summary__value">
                        {eligibleCount} <span class="summary__goal">/ 3</span>
                    </div>
                    <div class="summary__note">Need 3 heroes with 15 Standard wins each</div>
                </div>
                <div class="slds-box slds-theme_shade summary__card">
                    <div class="summary__label">Standard Matches</div>
                    <div class="summary__value">{totalMatches}</div>
                    <div class="summary__note">All-time, Standard (normal) mode</div>
                </div>
            </div>
            <div class="slds-m-top_small">
                <lightning-badge
                    label={statusLabel}
                    variant={statusVariant}
                    class="summary__status"
                ></lightning-badge>
            </div>
        </section>

        <div class="table-wrap slds-table_container--base">
            <table class="slds-table slds-table--bordered slds-table--fixed hero-table">
                <thead>
                    <tr>
                        <th scope="col" class="hero-table__hero">
                            <span class="slds-truncate" title="Hero">Hero</span>
                        </th>
                        <th scope="col">
                            <span class="slds-truncate" title="Wins">Wins</span>
                        </th>
                        <th scope="col">
                            <span class="slds-truncate" title="Ranked (15 wins)">Ranked (15)</span>
                        </th>
                        <th scope="col">
                            <span class="slds-truncate" title="Matches">Matches</span>
                        </th>
                        <th scope="col">
                            <span class="slds-truncate" title="Win rate">Win %</span>
                        </th>
                        <th scope="col">
                            <span class="slds-truncate" title="Kills / Deaths / Assists">K / D / A</span>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={rows} for:item="hero">
                        <tr key={hero.heroId} class={hero.rowClass}>
                            <th scope="row" class="hero-table__hero">
                                <span class="hero-cell">
                                    <img src={hero.icon} alt="" class="hero-icon" />
                                    <span class="slds-truncate" title={hero.name}>{hero.name}</span>
                                </span>
                            </th>
                            <td data-label="Wins">
                                <strong>{hero.wins}</strong>
                            </td>
                            <td data-label="Ranked (15 wins)">
                                <template if:true={hero.eligible}>
                                    <span class="slds-badge slds-theme_success slds-badge--entity">
                                        15 ✓
                                    </span>
                                </template>
                                <template if:false={hero.eligible}>
                                    <span class="hero-progress">
                                        <span class="hero-progress__bar">
                                            <span
                                                class="hero-progress__fill"
                                                style={hero.fillStyle}
                                            ></span>
                                        </span>
                                        <span class="hero-progress__label">{hero.wins} / 15</span>
                                    </span>
                                </template>
                            </td>
                            <td data-label="Matches">{hero.matches}</td>
                            <td data-label="Win rate">{hero.winRate}%</td>
                            <td data-label="Kills / Deaths / Assists">
                                {hero.kills} / {hero.deaths} / {hero.assists}
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </template>
</template>
