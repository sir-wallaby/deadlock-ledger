<template>
    <div class="search slds-card slds-theme_shade slds-p-around_medium">
        <h2 class="slds-text-heading_small slds-m-bottom_small">Add a player</h2>

        <div class="search__row slds-m-bottom_small">
            <lightning-input
                class="search__input"
                type="text"
                label="Steam username, SteamID64, or account ID"
                placeholder="e.g. 76561198xxxxxxxxx"
                value={query}
                onchange={onQueryChange}
            ></lightning-input>
            <lightning-button
                label="Find player"
                variant="brand"
                class="slds-m-left_x-small"
                disabled={searching}
                onclick={onFind}
            ></lightning-button>
        </div>

        <template if:true={searching}>
            <div class="slds-m-around_medium slds-grid slds-grid_vertical-align-center">
                <lightning-spinner
                    alternative-text="Searching"
                    variant="brand"
                    size="medium"
                ></lightning-spinner>
            </div>
        </template>

        <template if:false={searching}>
            <template if:true={error}>
                <div class="slds-alert slds-alert_error">
                    <p>{error}</p>
                </div>
            </template>

            <template if:false={error}>
                <template if:true={showHint}>
                    <p class="search__hint">
                        Paste your Steam profile link, 17-digit SteamID64, numeric account ID, or
                        Steam username.
                    </p>
                </template>

                <template if:true={showResults}>
                    <p class="search__hint">Choose the right profile:</p>
                    <ul class="results">
                        <template for:each={results} for:item="result" for:index="idx">
                            <li key={result.accountId}>
                                <button
                                    type="button"
                                    class="result-row"
                                    data-index={idx}
                                    onclick={onSelect}
                                >
                                    <img
                                        src={result.avatar}
                                        alt=""
                                        class="result-row__avatar"
                                    />
                                    <span class="result-row__name">{result.personaname}</span>
                                    <span class="result-row__id">#{result.accountId}</span>
                                </button>
                            </li>
                        </template>
                    </ul>
                </template>

                <template if:true={showConfirm}>
                    <div class="confirm slds-m-top_small">
                        <lightning-avatar
                            class="confirm__avatar slds-m-right_small"
                            src={selected.avatar}
                            initials={selectedInitials}
                            alternative-text={selected.personaname}
                            size="medium"
                        ></lightning-avatar>
                        <div class="confirm__id">
                            <div class="slds-text-heading_small">{selected.personaname}</div>
                            <div class="search__muted">account_id {selected.accountId}</div>
                        </div>
                        <div class="confirm__actions">
                            <lightning-button
                                label="Back"
                                variant="base"
                                class="slds-m-right_x-small"
                                onclick={onBack}
                            ></lightning-button>
                            <lightning-button
                                label="Track this player"
                                variant="brand"
                                onclick={onConfirm}
                            ></lightning-button>
                        </div>
                    </div>
                </template>
            </template>
        </template>
    </div>
</template>
