[package]
name = "deadlock-gc-history"
version = "0.1.0"
edition = "2021"
description = "Fetch own-account Deadlock match history straight from the Steam Game Coordinator"

[dependencies]
steam-vent = { path = "vendor/steam-vent" }
steam-vent-proto-common = "0.5.1"
steam-vent-proto-deadlock = { git = "https://codeberg.org/steam-vent/proto-deadlock" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rpassword = "7"
