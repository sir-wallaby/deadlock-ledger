server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Content-hashed LWR bundles + immutable assets (safe to cache forever)
    location /1/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SLDS assets (stable within a build)
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /favicon.ico {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Never cache the app shell so new deploys are picked up
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Own-account match history (updated out-of-band; never serve stale)
    location /data/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Single-page app: serve the shell for any unknown path
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
