<template>
    <template if:true={show}>
        <section class="rank-card slds-box slds-m-bottom_medium">
            <div class="rank-card__row">
                <div class="rank-card__badge">
                    <template if:true={rankInfo.icon}>
                        <div class="rank-card__shield">
                            <img src={rankInfo.icon} alt={rankInfo.name} class="rank-card__icon" />
                            <span class="rank-card__numeral">{rankInfo.numeral}</span>
                        </div>
                    </template>
                    <template if:false={rankInfo.icon}>
                        <div class="rank-card__unranked">{rankInfo.name}</div>
                    </template>
                </div>
                <div class="rank-card__main">
                    <div class="rank-card__title">{rankTitle}</div>
                    <template if:true={mmr}>
                        <div class="rank-card__points">
                            <div class="rank-card__points-label">
                                <span class="rank-card__mmr">{mmr.label}</span>
                                <span class="rank-card__mmr-unit">MMR</span>
                                <span class="rank-card__mmr-to">{mmr.toLabel}</span>
                            </div>
                            <template if:true={mmr.hasBar}>
                                <div class="rank-card__points-track">
                                    <div class="rank-card__points-fill" style={mmrFillStyle}></div>
                                </div>
                            </template>
                        </div>
                    </template>
                    <div class="rank-card__chips">
                        <template if:true={showCalibChip}>
                            <span class="chip">Calibration {calibCount}/{calibrationTotal}</span>
                        </template>
                        <template if:true={shieldUsed}>
                            <span class="chip chip--shield">Shield used</span>
                        </template>
                        <span class="chip chip--record">
                            <span class="chip__label">Season</span>
                            <span class="chip__value">{seasonRecord.wins}W {seasonRecord.losses}L</span>
                        </span>
                    </div>
                </div>
            </div>
        </section>
    
        <section class="chart-card slds-box slds-m-bottom_medium">
            <h2 class="chart-card__title slds-text-heading_small">MMR history — this season</h2>
            <template if:true={chart}>
                <svg
                    class="chart-card__svg"
                    viewBox={chart.viewBox}
                    xmlns="http://www.w3.org/2000/svg"
                    role="img"
                    aria-label="Ranked MMR history"
                >
                    <template for:each={chart.gridlines} for:item="g">
                        <g key={g.key}>
                            <line
                                x1={chart.padL}
                                x2={chart.plotRight}
                                y1={g.y}
                                y2={g.y}
                                class={g.cls}
                            ></line>
                            <text x={chart.labelX} y={g.labelY} class={g.labelCls}>{g.label}</text>
                        </g>
                    </template>
                    <polyline points={chart.polyline} class="chart__line"></polyline>
                    <template for:each={chart.points} for:item="p">
                        <circle key={p.i} cx={p.x} cy={p.y} r={chart.dot} class={p.cls}>
                            <title>{p.tooltip}</title>
                        </circle>
                    </template>
                    <template for:each={chart.xlabels} for:item="l">
                        <text key={l.key} x={l.x} y={chart.xLabelY} class="chart__x-label">{l.text}</text>
                    </template>
                </svg>
            </template>
            <template if:false={chart}>
                <p class="chart-card__none">No MMR data for this season yet.</p>
            </template>
        </section>
    
        <section class="ranked-heroes slds-m-bottom_medium">
            <h2 class="ranked-heroes__title slds-text-heading_small">Ranked heroes — this season</h2>
            <div class="table-wrap slds-table_container--base">
                <table class="slds-table slds-table--bordered slds-table--fixed ranked-heroes__table">
                    <thead>
                        <tr>
                            <th scope="col">
                                <span class="slds-truncate" title="Hero">Hero</span>
                            </th>
                            <th scope="col">
                                <span class="slds-truncate" title="Wins - Losses">W-L</span>
                            </th>
                            <th scope="col">
                                <span class="slds-truncate" title="Win rate">Win %</span>
                            </th>
                            <th scope="col">
                                <span class="slds-truncate" title="Kills / Deaths / Assists">K / D / A</span>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={heroRows} for:item="h">
                            <tr key={h.heroId}>
                                <th scope="row" class="ranked-heroes__hero">
                                    <span class="hero-cell">
                                        <img src={h.icon} alt="" class="hero-icon" />
                                        <span class="slds-truncate" title={h.name}>{h.name}</span>
                                    </span>
                                </th>
                                <td data-label="W-L">
                                    <strong>{h.record}</strong>
                                </td>
                                <td data-label="Win rate">{h.winRate}%</td>
                                <td data-label="K / D / A">{h.kda}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </section>
    
        <section class="ranked-recent slds-m-bottom_medium">
            <h2 class="ranked-recent__title slds-text-heading_small">
                Ranked matches — this season <span class="ranked-recent__tz">(Eastern time)</span>
            </h2>
            <ul class="ranked-recent__list">
                <template for:each={seasonMatches} for:item="m">
                    <li
                        key={m.key}
                        class={m.itemClass}
                        data-id={m.key}
                        onclick={handleRecentSelect}
                    >
                        <span class={m.badgeClass}>{m.label}</span>
                        <img src={m.icon} alt="" class="ranked-recent__icon" />
                        <span class="ranked-recent__name slds-truncate" title={m.name}>{m.name}</span>
                        <span class="ranked-recent__delta">{m.delta}</span>
                        <span class="ranked-recent__when">{m.when}</span>
                    </li>
                </template>
            </ul>
        </section>

        <template if:true={matchMmr}>
            <section class="match-mmr slds-box slds-m-bottom_medium">
                <h2 class="match-mmr__title slds-text-heading_small">Match MMR</h2>
                <div class="match-mmr__header">
                    <span class={matchMmr.outcomeClass}>{matchMmr.outcomeLabel}</span>
                    <span class="match-mmr__when">{matchMmr.when}</span>
                    <template if:true={matchMmr.ownHeroIcon}>
                        <img src={matchMmr.ownHeroIcon} alt="" class="match-mmr__hero-icon" />
                        <span class="match-mmr__hero-name">{matchMmr.ownHeroName}</span>
                    </template>
                    <span class="match-mmr__kda">{matchMmr.ownKda} KDA</span>
                    <template if:true={matchMmr.calibLabel}>
                        <span class="match-mmr__calib">{matchMmr.calibLabel}</span>
                    </template>
                </div>
                <template if:true={matchMmr.hasEntry}>
                    <div class="match-mmr__teams">
                        <div class="match-mmr__team">
                            <div class="match-mmr__team-head">
                                <div class="match-mmr__team-name">{matchMmr.team0Name}</div>
                                <template if:true={matchMmr.team0Avg}>
                                    <div
                                        class="match-mmr__team-avg"
                                        title="Average post-match MMR — players with a revealed rank (mid-calibration players have none yet)"
                                    >{matchMmr.team0Avg}</div>
                                </template>
                            </div>
                            <template for:each={matchMmr.team0} for:item="p">
                                <div key={p.key} class={p.rowClass}>
                                    <img src={p.icon} alt="" class="match-mmr__hero-icon" />
                                    <span class="match-mmr__badge">
                                        <template if:true={p.badgeIcon}>
                                            <img src={p.badgeIcon} alt="" class="match-mmr__badge-icon" />
                                            <span class="match-mmr__badge-numeral">{p.badgeNumeral}</span>
                                        </template>
                                        <template if:false={p.badgeIcon}>
                                            <span class="match-mmr__badge-text">{p.badgeText}</span>
                                        </template>
                                    </span>
                                    <span class="match-mmr__mmr">{p.mmrText}</span>
                                    <span class={p.deltaClass} title={p.deltaTitle}>{p.deltaText}</span>
                                    <template if:true={p.shield}>
                                        <svg
                                            class="match-mmr__shield"
                                            viewBox="0 0 16 16"
                                            role="img"
                                            aria-label="Demotion protection applied"
                                        >
                                            <path d="M8 1l6 2.2v4.3c0 3.9-2.6 6.9-6 7.9-3.4-1-6-4-6-7.9V3.2L8 1z"></path>
                                        </svg>
                                    </template>
                                </div>
                            </template>
                        </div>
                        <div class="match-mmr__team">
                            <div class="match-mmr__team-head">
                                <div class="match-mmr__team-name">{matchMmr.team1Name}</div>
                                <template if:true={matchMmr.team1Avg}>
                                    <div
                                        class="match-mmr__team-avg"
                                        title="Average post-match MMR — players with a revealed rank (mid-calibration players have none yet)"
                                    >{matchMmr.team1Avg}</div>
                                </template>
                            </div>
                            <template for:each={matchMmr.team1} for:item="p">
                                <div key={p.key} class={p.rowClass}>
                                    <img src={p.icon} alt="" class="match-mmr__hero-icon" />
                                    <span class="match-mmr__badge">
                                        <template if:true={p.badgeIcon}>
                                            <img src={p.badgeIcon} alt="" class="match-mmr__badge-icon" />
                                            <span class="match-mmr__badge-numeral">{p.badgeNumeral}</span>
                                        </template>
                                        <template if:false={p.badgeIcon}>
                                            <span class="match-mmr__badge-text">{p.badgeText}</span>
                                        </template>
                                    </span>
                                    <span class="match-mmr__mmr">{p.mmrText}</span>
                                    <span class={p.deltaClass} title={p.deltaTitle}>{p.deltaText}</span>
                                    <template if:true={p.shield}>
                                        <svg
                                            class="match-mmr__shield"
                                            viewBox="0 0 16 16"
                                            role="img"
                                            aria-label="Demotion protection applied"
                                        >
                                            <path d="M8 1l6 2.2v4.3c0 3.9-2.6 6.9-6 7.9-3.4-1-6-4-6-7.9V3.2L8 1z"></path>
                                        </svg>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                    <template if:true={matchMmr.ladder}>
                        <div class="match-mmr__ladder">
                            <div class="match-mmr__ladder-bar">
                                <template for:each={matchMmr.ladder.ticks} for:item="t">
                                    <div key={t.key} class={t.cls} style={t.style}></div>
                                </template>
                                <div
                                    class="match-mmr__ladder-marker match-mmr__ladder-marker--before"
                                    style={matchMmr.ladder.beforeStyle}
                                ></div>
                                <div class={matchMmr.ladder.afterCls} style={matchMmr.ladder.afterStyle}></div>
                            </div>
                            <div class="match-mmr__ladder-sublabels">
                                <template for:each={matchMmr.ladder.sublabels} for:item="l">
                                    <span key={l.key} style={l.style}>{l.text}</span>
                                </template>
                            </div>
                            <div class="match-mmr__ladder-ranklabels">
                                <template for:each={matchMmr.ladder.rankLabels} for:item="l">
                                    <span key={l.key} style={l.style}>{l.text}</span>
                                </template>
                            </div>
                            <div class="match-mmr__ladder-legend">
                                <span class="match-mmr__ladder-swatch match-mmr__ladder-swatch--before"></span>
                                before
                                <span class="match-mmr__ladder-swatch match-mmr__ladder-swatch--after"></span>
                                after
                            </div>
                        </div>
                    </template>
                    <p class="match-mmr__summary">
                        <template if:true={matchMmr.badgeShift}>
                            <span class="match-mmr__summary-badge">{matchMmr.badgeShift}</span>
                        </template>
                        <span>{matchMmr.pointsText}</span>
                        <template if:true={matchMmr.note}>
                            <span class="match-mmr__summary-note"> · {matchMmr.note}</span>
                        </template>
                    </p>
                </template>
                <template if:false={matchMmr.hasEntry}>
                    <p class="match-mmr__pending">
                        Metadata for this match hasn't been fetched yet — the poller drains the backlog a few matches per run.
                    </p>
                </template>
            </section>
        </template>
    </template>
</template>
